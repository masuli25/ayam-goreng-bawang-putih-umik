<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0066ff">
<title>UMIK Admin - Printlet</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f2f4f7;color:#171717}
header{height:54px;padding:0 14px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px}
header strong{font-size:15px}
#status{font-size:12px;color:#d9e5ff}
main{height:calc(100% - 54px);display:flex;flex-direction:column}
#notice{padding:9px 12px;background:#eaf2ff;color:#174a91;font-size:12px;line-height:1.4}
button{border:0;border-radius:7px;padding:9px 12px;background:#0066ff;color:#fff;font-weight:bold;font-size:12px;white-space:nowrap}
iframe{display:block;border:0;width:100%;flex:1;background:#fff}
</style>
</head>
<body>
<header>
  <strong>AYAM BAWANG UMIK · ADMIN</strong>
  <span id="status">Memeriksa Printlet…</span>
</header>
<main>
  <div id="notice">Buka halaman ini melalui aplikasi Printlet agar struk dapat dikirim ke printer Bluetooth.</div>
  <div style="padding:8px 12px;background:#fff;display:flex;align-items:center;gap:10px">
    <button id="testPrintButton" type="button">TES CETAK PENGHUBUNG</button>
    <span style="font-size:11px;color:#666">Tes ini tidak memakai atau mengubah pesanan.</span>
  </div>
  <iframe id="adminFrame" title="UMIK Admin" src="https://script.google.com/macros/s/AKfycbyhgeEwHxHg3hhZQpMYlJc2AA8F1931P3sL5kiEfws1rVOaRPI1ycorQdsOr_EBBtE/exec?admin=1" allow="clipboard-read; clipboard-write"></iframe>
</main>
<script>
(function(){
  var frame=document.getElementById('adminFrame');
  var status=document.getElementById('status');
  var notice=document.getElementById('notice');
  var bridge=!!(window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage==='function');

  status.textContent=bridge?'Printlet terdeteksi':'Buka melalui Printlet';
  status.style.color=bridge?'#9ff0b2':'#ffe09a';
  if(bridge){
    notice.textContent='Printlet terhubung. Gunakan menu Pesanan di bawah, lalu tekan tombol cetak struk.';
  }


  document.getElementById('testPrintButton').addEventListener('click',function(){
    if(!window.ReactNativeWebView || typeof window.ReactNativeWebView.postMessage!=='function'){
      alert('Bridge Printlet tidak terdeteksi pada halaman utama.');
      return;
    }
    var canvas=document.createElement('canvas');
    canvas.width=384; canvas.height=430;
    var ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,384,430);
    ctx.fillStyle='#000'; ctx.textAlign='center';
    ctx.font='bold 25px Arial'; ctx.fillText('AYAM BAWANG UMIK',192,48);
    ctx.font='bold 21px Arial'; ctx.fillText('TES PENGHUBUNG ADMIN',192,95);
    ctx.textAlign='left'; ctx.font='17px Arial';
    ctx.fillText('--------------------------------',10,135);
    ctx.fillText('Tes dari halaman Admin Printlet',10,175);
    ctx.fillText('Ukuran gambar: 384 px',10,210);
    ctx.fillText('Status: UJI PENGHUBUNG',10,245);
    ctx.fillText('--------------------------------',10,285);
    ctx.textAlign='center'; ctx.font='bold 22px Arial';
    ctx.fillText('JIKA TERBACA, BERHASIL',192,345);
    ctx.font='16px Arial'; ctx.fillText('UMIK PRINT BRIDGE',192,385);
    var dataUrl=canvas.toDataURL('image/png');
    notice.textContent='Mengirim tes penghubung ('+Math.round(dataUrl.length*0.75/1024)+' KB)…';
    window.ReactNativeWebView.postMessage(JSON.stringify({data_img:dataUrl,fit:false}));
  });

  window.addEventListener('message',function(event){
    // Admin Google Apps Script dapat berada di dalam iframe perantara.
    // Karena itu sumber pesan tidak selalu sama dengan frame.contentWindow.
    // Batasi penerimaan pada origin Google Apps Script / Googleusercontent.
    if(!/^(https:\/\/)?([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/i.test(event.origin)) return;

    var msg=event.data;
    if(typeof msg==='string'){
      try{msg=JSON.parse(msg);}catch(e){return;}
    }
    if(!msg || msg.type!=='UMIK_PRINT_RECEIPT') return;

    var dataUrl=msg.data_img;
    if(typeof dataUrl!=='string' || !/^data:image\/(png|jpeg);base64,/.test(dataUrl)){
      alert('Gambar struk tidak valid. Silakan coba cetak kembali.');
      return;
    }
    if(dataUrl.length>1400000){
      alert('Ukuran gambar struk terlalu besar. Silakan coba lagi.');
      return;
    }
    if(!window.ReactNativeWebView || typeof window.ReactNativeWebView.postMessage!=='function'){
      alert('Printlet tidak terdeteksi. Buka halaman Admin ini dari aplikasi Printlet.');
      return;
    }

    // Kirim dengan format yang sama persis seperti halaman test print yang sudah terbukti berhasil.
    var imageKB=Math.round(dataUrl.length*0.75/1024);
    notice.textContent='Mengirim gambar struk ('+imageKB+' KB) ke Printlet…';
    window.ReactNativeWebView.postMessage(JSON.stringify({
      data_img: dataUrl,
      fit: false
    }));
    notice.textContent='Gambar struk diterima dan diteruskan ke Printlet ('+imageKB+' KB). Tunggu beberapa detik dan periksa printer.';
  });
})();
</script>
</body>
</html>
